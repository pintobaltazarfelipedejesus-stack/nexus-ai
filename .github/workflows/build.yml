name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crear proyecto y compilar
        run: |
          unzip -q nexus-ai-etapa1.zip
          npx --yes create-expo-app@latest app --template blank --no-install
          cp nexus-ai/App.js nexus-ai/app.json app/
          cp -r nexus-ai/src app/
          cd app
          npm install
          npx expo install llama.rn expo-device expo-file-system @react-native-async-storage/async-storage
          npm install react-native-markdown-display
          npx expo prebuild -p android
          cd android
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-apk
          path: app/android/app/build/outputs/apk/release/*.apk
